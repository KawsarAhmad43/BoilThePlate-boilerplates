version: '3.8'

services:
  # The MySQL database service
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: student_db
      MYSQL_USER: student
      MYSQL_PASSWORD: secret123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Our FastAPI application service
  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      # these variables are read by os.getenv in database.py
      - DB_HOST=db
      - DB_USER=student
      - DB_PASSWORD=secret123
      - DB_NAME=student_db
    depends_on:
      - db

volumes:
  # This makes sure the database data isn't lost if the container stops
  db_data:
